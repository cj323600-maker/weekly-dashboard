<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>코오롱오토옥션 주간 보고</title>
<link rel="preconnect" href="https://cdn.jsdelivr.net">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css">
<style>
:root{
  --ink:#0f1a24; --muted:#6b7c8c; --line:#e3e8ed; --canvas:#f2f4f7; --surface:#fff;
  --ok:#0e7c66; --warn:#b47800; --bad:#c0392b; --base:#1f6feb; --est:#7f9bb5;
  --sans:"Pretendard Variable",Pretendard,-apple-system,system-ui,"Malgun Gothic",sans-serif;
}
*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{font-family:var(--sans);background:var(--canvas);color:var(--ink);
  font-size:14px;line-height:1.5;-webkit-font-smoothing:antialiased}
h2{margin:0;font-size:14px;font-weight:700;letter-spacing:-.02em}

.top{background:var(--ink);color:#fff;padding:14px 16px;border-bottom:3px solid var(--ok)}
.top b{font-size:16px;letter-spacing:-.03em}
.top .m{display:flex;align-items:center;gap:8px;margin-top:4px;font-size:11.5px;color:#9fb3c4}
.top .m span{margin-left:auto;color:#ffb4ac;border:1px solid rgba(255,180,172,.4);
  padding:2px 7px;border-radius:4px;font-weight:700;font-size:10.5px}
.top .m span.smp{margin-left:auto;color:#ffd79a;border-color:rgba(255,215,154,.45)}
.top .m span+span{margin-left:6px}

.wrap{max-width:520px;margin:0 auto;padding:14px 14px 48px}
@media(min-width:900px){.wrap{max-width:1080px}}

.kpis{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:14px}
@media(min-width:900px){.kpis{grid-template-columns:repeat(4,1fr)}}
.kpi{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:11px 12px}
.kpi .t{font-size:11px;color:var(--muted);font-weight:600;letter-spacing:-.01em}
.kpi .v{font-size:21px;font-weight:800;letter-spacing:-.04em;margin-top:2px;line-height:1.15}
.kpi .v em{font-size:12px;font-weight:600;font-style:normal;color:var(--muted);margin-left:2px}
.kpi .s{font-size:11px;color:var(--muted);margin-top:3px}
.kpi .s b{font-weight:700}
.kpi.ok{border-left:3px solid var(--ok)} .kpi.warn{border-left:3px solid var(--warn)}
.kpi.bad{border-left:3px solid var(--bad)}
.kpi .s b.ok{color:var(--ok)} .kpi .s b.warn{color:var(--warn)} .kpi .s b.bad{color:var(--bad)}

.card{background:var(--surface);border:1px solid var(--line);border-radius:10px;
  padding:12px;margin-bottom:12px}
.card .hd{display:flex;align-items:baseline;gap:6px;margin-bottom:8px;flex-wrap:wrap}
.card .hd h2{white-space:nowrap;flex:0 0 auto}
.card .hd .u{margin-left:auto;font-size:11px;color:#4a5a6a;
  white-space:normal;text-align:right;flex:1 1 auto;min-width:0;line-height:1.35}
@media(max-width:620px){
  .card .hd .u{margin-left:0;text-align:left;flex-basis:100%;font-size:10px}
}
.cw{position:relative;height:230px}
.cw.tall{height:300px}
@media(max-width:620px){
  .cw{height:250px}
  .cw.tall{height:320px}
  .cw.sm{height:190px}
}
.cw.mid{height:210px}
@media(min-width:900px){.grid2{display:grid;grid-template-columns:1fr 1fr;gap:12px}
  .grid2 .card{margin-bottom:0}.grid2{margin-bottom:12px}}
@media(min-width:860px){.grid3{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}
  .grid3 .card{margin-bottom:0}.grid3{margin-bottom:12px}}

.pt{margin:20px 0 8px;font-size:12px;font-weight:800;letter-spacing:-.02em;color:var(--ink);
  border-left:3px solid var(--ink);padding-left:8px}
.pt em{font-style:normal;font-weight:600;color:var(--muted);margin-left:5px;font-size:11px}

.tw{overflow-x:auto;-webkit-overflow-scrolling:touch;margin:0 -12px;padding:0 12px}
table{border-collapse:collapse;width:100%;font-size:11.5px;white-space:nowrap}
th,td{border-bottom:1px solid var(--line);padding:6px 6px;text-align:right}
th{font-weight:700;color:var(--muted);font-size:10.5px;background:#f8fafb;
  border-bottom:1px solid #cfd8e0}
th.l,td.l{text-align:left}
td.n{font-variant-numeric:tabular-nums}
th:first-child,td:first-child{position:sticky;left:0;background:var(--surface);z-index:1;
  min-width:104px;max-width:130px;white-space:normal}
th:first-child{background:#f8fafb}
tr.sub td{background:#f6f8fa;font-weight:700}
tr.sub td:first-child{background:#f6f8fa}
tr.tot td{background:#eef2f5;font-weight:800;border-bottom:1px solid #cfd8e0}
tr.tot td:first-child{background:#eef2f5}
tr.der td{color:var(--muted);font-size:10.5px}
td .nm{font-weight:600;display:block;line-height:1.25}
td .ds{color:var(--muted);font-size:10px;display:block;line-height:1.25}
.est{color:var(--est)}
.bg{display:inline-block;padding:1px 6px;border-radius:9px;font-size:10px;font-weight:800;
  border:1px solid}
.bg.ok{color:var(--base);border-color:#bcd4f6;background:#eef4fd}
.bg.warn{color:var(--warn);border-color:#f0dca8;background:#fdf7e8}
.bg.bad{color:var(--bad);border-color:#f2c4bd;background:#fdeeec}
.bg.na{color:var(--muted);border-color:var(--line);background:#f6f8fa}

.lg{display:flex;flex-wrap:wrap;gap:10px;font-size:11.5px;color:#3b4b5a;font-weight:600;margin-top:8px}
.lg i{width:9px;height:9px;border-radius:2px;display:inline-block;margin-right:4px;
  vertical-align:-1px}
/* 5대 핵심 지표 */
.kpi5{display:grid;grid-template-columns:1fr 1fr;gap:9px;margin-bottom:14px}
@media(min-width:820px){.kpi5{grid-template-columns:repeat(5,1fr)}}
.k5{background:var(--surface);border:1px solid var(--line);border-radius:10px;
  padding:11px 12px}
.k5.ok{border-left:3px solid var(--base)} .k5.warn{border-left:3px solid var(--warn)}
.k5.bad{border-left:3px solid var(--bad)}
.k5{display:flex;flex-direction:column}
.k5 .t{font-size:11.5px;color:var(--ink);font-weight:800;letter-spacing:-.02em;
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.k5 .kb{display:inline-block;align-self:flex-start;margin-top:4px;font-size:9.5px;
  font-weight:800;padding:2px 6px;border-radius:9px;white-space:nowrap}
.k5 .kb.ok{background:#eef4fd;color:var(--base);border:1px solid #bcd4f6}
.k5 .kb.bad{background:#fdecea;color:var(--bad);border:1px solid #f5c9c3}
.k5 .kb.na{background:#f6f8fa;color:var(--muted);border:1px solid var(--line)}
.k5 .v .sl{font-size:15px;font-weight:600;color:#b9c4ce;margin:0 3px}
.k5 .v .tv{font-size:15px;font-weight:700;color:var(--muted)}
.k5 .v{font-size:23px;font-weight:800;letter-spacing:-.045em;line-height:1.12;margin-top:6px;
  font-variant-numeric:tabular-nums}
.k5 .v em{font-size:11.5px;font-weight:600;font-style:normal;color:var(--muted);margin-left:2px}
.k5 .d{margin-top:3px}
.dl{font-size:11px;font-weight:800;font-variant-numeric:tabular-nums}
.dl em{font-style:normal;font-weight:600;font-size:9.5px;color:var(--muted);margin-left:4px}
.dl.up{color:var(--base)} .dl.dn{color:var(--bad)} .dl.flat{color:var(--muted)}
.k5 .s{font-size:10.5px;color:var(--muted);margin-top:auto;padding-top:6px;
  border-top:1px dashed var(--line)}
.k5 .s b.ok{color:var(--ok)} .k5 .s b.warn{color:var(--warn)} .k5 .s b.bad{color:var(--bad)}
/* 지표별 순위 카드 */
/* 모바일 전용 전치 표 */
.only-mob{display:block}
.only-desk{display:none}
@media(min-width:760px){.only-mob{display:none}.only-desk{display:block}}
table.rkm.mob{min-width:0;width:100%;table-layout:fixed}
table.rkm.mob th,table.rkm.mob td{padding:6px 2px;font-size:10px}
table.rkm.mob th:first-child,table.rkm.mob td:first-child{width:56px;min-width:56px;
  position:static}
table.rkm.mob .mn{font-size:9.5px;font-weight:700;color:var(--muted);
  white-space:normal;line-height:1.25;letter-spacing:-.04em}
table.rkm.mob .ct{font-size:9.5px;letter-spacing:-.06em;overflow:hidden;
  text-overflow:ellipsis;white-space:nowrap}
table.rkm.mob .cv{font-size:8.5px;letter-spacing:-.04em}
table.rkm.mob .cw{font-size:9px;margin-right:0}
table.rkm.mob tr.tot td{background:#f0f3f6;font-weight:800}
table.rkm.mob td.sum{font-size:11px}
table.rkm.mob .bg{font-size:8.5px;padding:1px 3px}
/* 가로 스크롤 표에 끝 표시 */
.card:not(.mcard) .tw{background:linear-gradient(90deg,transparent 92%,
  rgba(15,26,36,.05));background-attachment:local}
/* 순위 매트릭스 */
table.rkm{width:100%;min-width:560px;border-collapse:collapse}
table.rkm th{font-size:9.5px;padding:6px 5px;white-space:nowrap;text-align:center}
table.rkm th.l{text-align:left}
table.rkm td{padding:7px 5px;text-align:center;white-space:nowrap;
  border-bottom:1px solid var(--line);font-size:11px}
table.rkm td.l{text-align:left}
table.rkm th:first-child,table.rkm td:first-child{position:sticky;left:0;
  background:var(--surface);z-index:1;min-width:60px;width:60px}
table.rkm th:first-child{background:#f8fafb}
table.rkm tr.top td{background:#fdf7e8}
table.rkm tr.top td:first-child{background:#fdf7e8}
table.rkm td.c1{background:#fdf7e8}
table.rkm .ct{display:block;font-weight:700;letter-spacing:-.03em;font-size:11px}
table.rkm tr.top .ct{font-weight:800;color:#8a5c00}
table.rkm .cv{display:block;font-size:9.5px;color:var(--muted);margin-top:1px;
  font-variant-numeric:tabular-nums}
table.rkm tr.top .cv{color:#a08245}
table.rkm .cw{margin-right:2px}
table.rkm .rn{display:inline-block;width:16px;height:16px;line-height:16px;
  border-radius:50%;background:#e7ecf1;color:var(--muted);font-size:9.5px;
  font-weight:800;text-align:center}
table.rkm tr.top .rn{background:#b47800;color:#fff}
table.rkm .rl{display:none}
table.rkm .tmn{font-weight:700;letter-spacing:-.02em}
table.rkm td.sum{font-weight:800;font-variant-numeric:tabular-nums;font-size:12px;
  color:var(--ink)}
table.rkm tr.top td.sum{color:#8a5c00}
table.rkm .tmn{color:var(--ink)}
table.rkm tr.top .tmn{color:#8a5c00;font-weight:800}
table.rkm tr.top td{color:#8a5c00}
table.rkm.sc .ct{font-size:10.5px;color:var(--muted);font-weight:700}
table.rkm.sc tr.top .ct{color:#8a5c00}
table.rkm.sc .cv{font-weight:800;color:var(--ink);font-size:11px}
/* 주간 팀별 성적표 — 매출이익 기준 순위 */
.headline{background:var(--surface);border:1px solid var(--line);border-left:4px solid var(--ink);
  border-radius:10px;padding:11px 14px;margin-bottom:14px;font-size:13.5px;font-weight:800;
  letter-spacing:-.02em;line-height:1.45}
.headline b.pos{color:var(--base)} .headline b.neg{color:var(--bad)}
.sccard{padding:0;overflow:hidden}
.sccard .tw{margin:0;padding:0}
table.sct{width:100%;border-collapse:separate;border-spacing:0;min-width:610px;
  table-layout:fixed}
table.sct th{font-size:9.5px;font-weight:800;color:#fff;padding:8px 4px;text-align:center;
  background:var(--ink);white-space:nowrap;letter-spacing:-.03em}
table.sct th.l{text-align:left;padding-left:6px} table.sct th.c{text-align:center}
table.sct th em{display:block;font-style:normal;font-size:8px;font-weight:600;
  color:#9fb3c4;margin-top:1px;letter-spacing:-.04em}
table.sct td{padding:9px 4px;border-bottom:1px solid var(--line);vertical-align:middle;
  text-align:center;white-space:nowrap;font-size:11.5px;background:var(--surface)}
table.sct td.l{text-align:left;padding-left:6px} table.sct td.c{text-align:center}
table.sct col.w1{width:28px} table.sct col.w2{width:74px} table.sct col.wbar{width:52px}
table.sct col.wv{width:60px} table.sct col.wt{width:46px} table.sct col.wd{width:48px}
table.sct col.wa{width:50px} table.sct col.wr{width:63px}
table.sct .rk{display:inline-block;width:17px;height:17px;line-height:17px;border-radius:50%;
  color:#fff;font-size:9.5px;font-weight:800;text-align:center}
table.sct .rk.g{background:var(--base)} table.sct .rk.r{background:var(--bad)}
table.sct .nm{display:block;font-size:11px;font-weight:800;letter-spacing:-.055em;
  color:var(--ink);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
table.sct .ow{display:block;font-size:8.5px;color:var(--muted);line-height:1.2;margin-top:0}
table.sct td.big{font-size:16px;font-weight:800;letter-spacing:-.05em;
  font-variant-numeric:tabular-nums;background:#f4f7fb}
table.sct tr.tot td.big{background:#e9eff7}
table.sct td.sub{color:var(--muted);font-variant-numeric:tabular-nums;font-size:11px}
table.sct td.pos{color:var(--base);font-weight:800;font-variant-numeric:tabular-nums}
table.sct td.neg{color:var(--bad);font-weight:800;font-variant-numeric:tabular-nums}
table.sct td.ach{font-size:12.5px}
table.sct th.colref{background:#26374a;font-size:10px}
table.sct td.colref{background:#fafbfc}
table.sct tr.tot td.colref{background:#f1f4f7}
table.sct .rv{display:block;font-size:13px;font-weight:800;letter-spacing:-.04em;
  font-variant-numeric:tabular-nums;line-height:1.15}
table.sct .rv.pos{color:var(--base)} table.sct .rv.neg{color:var(--bad)}
table.sct .rt2{display:block;font-size:10px;color:#8b98a5;font-weight:600;
  font-variant-numeric:tabular-nums;line-height:1.25;margin-top:1px}
table.sct .rd{display:inline-block;margin-top:2px;font-size:9.5px;font-weight:800;
  font-variant-numeric:tabular-nums;letter-spacing:-.04em;padding:0 4px;border-radius:8px}
table.sct .rd.pos{color:#14539e;background:#dbe8fb}
table.sct .rd.neg{color:#a5301f;background:#f9d5cf}
table.sct td.colbar{padding:9px 5px}
table.sct tr.tot td{border-top:2px solid var(--ink);border-bottom:0;background:#f6f8fa;
  font-weight:800}
.pb{position:relative;height:13px;border-radius:7px;background:#eef1f4;overflow:hidden}
.pf{position:absolute;left:0;top:0;bottom:0;border-radius:8px}
.pf.g{background:linear-gradient(90deg,#4a90f0,#1f6feb)}
.pf.r{background:linear-gradient(90deg,#e08074,#c0392b)}
.pk{position:absolute;top:1px;bottom:1px;width:2px;background:var(--ink);border-radius:1px}
.only-mob{display:block} .only-desk{display:none}
@media(min-width:721px){.only-mob{display:none}.only-desk{display:block}}
.sccards{padding:10px}
.scc{border:1px solid var(--line);border-radius:9px;padding:9px 10px;margin-bottom:8px}
.scc:last-child{margin-bottom:0}
.scc.tot{background:#f6f8fa;border-color:#cfd8e0}
.scc-h{display:flex;align-items:center;gap:5px}
.scc-h .rk{display:inline-block;width:18px;height:18px;line-height:18px;border-radius:50%;
  color:#fff;font-size:9.5px;font-weight:800;text-align:center;flex:0 0 auto}
.scc-h .rk.g{background:var(--base)} .scc-h .rk.r{background:var(--bad)}
.scc-h .nm{font-size:12.5px;font-weight:800;letter-spacing:-.03em}
.scc-h .ow{font-size:9.5px;color:var(--muted)}
.scc-h .ach{margin-left:auto;font-size:13px;font-weight:800;
  font-variant-numeric:tabular-nums}
.scc-h .ach.pos{color:var(--base)} .scc-h .ach.neg{color:var(--bad)}
.scc-m{display:flex;align-items:baseline;gap:5px;margin-top:4px;padding-bottom:7px;
  border-bottom:1px dashed var(--line)}
.scc-m b{font-size:19px;font-weight:800;letter-spacing:-.05em;
  font-variant-numeric:tabular-nums}
.scc-m s{text-decoration:none;font-size:10.5px;color:var(--muted)}
.scc-m i{margin-left:auto;font-style:normal;font-size:11.5px;font-weight:800;
  padding:1px 6px;border-radius:9px}
.scc-m i.pos{color:#14539e;background:#dbe8fb}
.scc-m i.neg{color:#a5301f;background:#f9d5cf}
.scc-g{display:grid;grid-template-columns:1fr 1fr;gap:5px;margin-top:7px}
.sq{background:#f8fafb;border-radius:6px;padding:5px 7px;display:flex;
  align-items:baseline;gap:4px;flex-wrap:wrap}
.sq em{font-style:normal;font-size:9.5px;color:var(--muted);font-weight:700;
  flex:0 0 46px}
.sq b{font-size:12px;font-weight:800;font-variant-numeric:tabular-nums;
  letter-spacing:-.03em}
.sq b.pos{color:var(--base)} .sq b.neg{color:var(--bad)}
.sq s{text-decoration:none;font-size:9px;color:#8b98a5;font-variant-numeric:tabular-nums}
.sq i{margin-left:auto;font-style:normal;font-size:9px;font-weight:800;
  font-variant-numeric:tabular-nums;padding:0 4px;border-radius:8px}
.sq i.pos{color:#14539e;background:#dbe8fb}
.sq i.neg{color:#a5301f;background:#f9d5cf}
.sclg{display:flex;flex-wrap:wrap;gap:10px;font-size:10.5px;color:var(--muted);

.card.issue ul{margin:0;padding-left:16px}

  .sccard .tw{overflow:hidden}
  table.sct{min-width:0;width:100%;table-layout:fixed}
  /* 막대 열은 display:none 대신 폭 0으로 — 셀↔col 1:1 유지 (브라우저별 빈 열 방지) */

  table.sct th{padding:4px 1px} table.sct th em{display:block}
  table.sct .rv{margin:0} table.sct .rt2{margin:0}

const NW = DATA.weeks.length;
const isEst = i => i >= DATA.actual;

const nz = v => (v === null || v === undefined || isNaN(v)) ? null : v;
function addA(a, b){ const o = []; for(let i=0;i<NW;i++){
  const x=nz(a?a[i]:null), y=nz(b?b[i]:null);
  o[i] = (x===null && y===null) ? null : (x||0)+(y||0); } return o; }
function sumRows(rows){ return rows.reduce((a,r)=>addA(a, r.w), new Array(NW).fill(null)); }
/* mode: false=합계 · true=시점(마지막 주) · 'avg'=주 평균 — 시트 M열 규칙과 동일 */
function fcast(w, mode){ const v = w.filter(x=>nz(x)!==null);
  if(!v.length) return null;
  if(mode === 'avg') return v.reduce((a,b)=>a+b,0) / v.length;
  return mode ? v[v.length-1] : v.reduce((a,b)=>a+b,0); }
function fmode(r){ return r.avg ? 'avg' : (r.stock ? true : false); }
function fcRow(r){ return (r.mo !== undefined && r.mo !== null)
  ? r.mo : fcast(r.w, fmode(r)); }
function ratio(a, b){ const o=[]; for(let i=0;i<NW;i++){
  o[i] = (nz(a[i])===null || !b[i]) ? null : a[i]/b[i]; } return o; }
function pace(w){ let c=0,o=[]; for(let i=0;i<NW;i++){
  if(nz(w[i])===null){ o[i]=null; } else { c+=w[i]; o[i]=c; } } return o; }

function grade(ach, inv){
  if(ach===null) return {k:'na', s:'-'};
  const v = inv ? (2 - ach) : ach;
  return (v >= 1) ? {k:'ok', s:'달성'} : {k:'bad', s:'미달'};
}

/* 표기 */
const cm = n => n.toString().replace(/\B(?=(\d{3})+(?!\d))/g, ",");
function fmt(v, f){
  if(nz(v)===null) return '-';
  switch(f){
    case 'pct': return (v*100).toFixed(1)+'%';
    case 'mil': return cm(Math.round(v/1e6));
    case 'man': return cm(Math.round(v/1e4));
    case 'won': return cm(Math.round(v));
    case 'dec': return v.toFixed(1);
    default:    return cm(Math.round(v));
  }
}

/* ══════════════════════ 가로 바(HB) 렌더러 ══════════════════════
   rows: [{lb, sub, rank, val, tgt_s, ach, dd, tgt, parts:[{v,cls}]}] · 스케일: 목표 = 트랙 75% 지점 */
const HB_T = 0.75;
function hbFill(ratio){ return Math.max(0, Math.min(ratio * HB_T, 1)) * 100; }
function hbRows(rows, o){
  o = o || {};
  return '<div class="hb">'+rows.map(function(r){
    const ok = r.ach !== null && r.ach >= 1;
    let fills = '';
    if(r.parts && r.parts.length){

      r.parts.forEach(function(p){
        const w0 = hbFill(acc / r.tgt), w1 = hbFill((acc + p.v) / r.tgt);
        fills += '<div class="hb-f '+p.cls+(ok?'':' bad')+'" style="left:'+w0.toFixed(2)+'%;width:'+(w1-w0).toFixed(2)+'%;border-radius:0"></div>';
        acc += p.v;
      });
    } else {
      fills = '<div class="hb-f'+(ok?' pos':'')+'" style="width:'+hbFill(r.ach||0).toFixed(2)+'%"></div>';
    }
    return '<div class="hb-row">'+
      '<div class="hb-l">'+(r.rank?'<span class="rk '+(ok?'g':'r')+'">'+r.rank+'</span>':'')+r.lb+(r.sub?'<small>'+r.sub+'</small>':'')+'</div>'+
      '<div class="hb-t">'+fills+'<span class="hb-tg" style="left:'+(HB_T*100)+'%"><i>'+(o.tgLabel||'목표')+'</i></span></div>'+
      '<div class="hb-v"><b>'+r.val+'</b><span class="tg"> / '+r.tgt_s+'</span>'+
        (r.ach!==null ? '<span class="bg '+(ok?'ok':'bad')+'">'+(r.ach*100).toFixed(o.dec===undefined?1:o.dec)+'%</span>' : '')+
        (r.dd ? '<span class="dd '+(ok?'pos':'neg')+'">'+r.dd+'</span>' : '')+'</div>'+
    '</div>'; }).join('')+'</div>';
}

/* 카드 배치: 3장 → grid3, 나머지 2장씩 → grid2 (빈 칸 없이 폭 전부 사용) */
function packCards(cards){
  let out = '';
  for(let i = 0; i < cards.length; ){
    const rem = cards.length - i;
    const n = (rem === 4 || rem === 2) ? 2 : (rem >= 3 ? 3 : rem);
    out += '<div class="'+(n === 3 ? 'grid3' : (n === 2 ? 'grid2' : 'grid1'))+'">'+cards.slice(i, i+n).join('')+'</div>';
    i += n;
  }
  return out;
}

const CHARTS = [];
function build(el, cfg){
  const pad = cfg.options && cfg.options.layout && cfg.options.layout.padding;
  if(pad && (pad.right === RPAD || cfg._rp)){ cfg._rp = true; pad.right = rpadNow(); }
  const ch = new Chart(el, cfg);
  CHARTS.push({el:el, cfg:cfg, ch:ch});
}
function mk(id, cfg){
  const el = document.getElementById(id);
  if(!el || !window.Chart) return;
  const d = el.closest ? el.closest('details') : null;
  if(d && !d.open){                     /* 접힌 영역은 폭이 0이라 펼칠 때 생성 */
    (d._pend = d._pend || []).push(()=>{ build(el, cfg); });
    if(!d._bound){
      d._bound = true;
      d.addEventListener('toggle', ()=>{
        if(d.open && d._pend){ d._pend.forEach(f=>f()); d._pend = null; }
      });
    }
    return;
  }
  build(el, cfg);
}
(function(){

      if(n === NARROW) return;
      NARROW = n;
      CHARTS.forEach(function(c){
        try{ c.ch.destroy(); }catch(e){}
        const pad = c.cfg.options && c.cfg.options.layout && c.cfg.options.layout.padding;

/* ── 라벨ㆍ기준선 플러그인 ──────────────────────────
   1) 기준선의 픽셀 위치를 ch._ty 에 등록
   2) 값 라벨은 ch._ty 및 이미 그린 라벨과 겹치면 자동으로 밀어냄
   3) 기준선 라벨(칩)은 플롯 바깥 여백에만 그림 → 데이터와 절대 안 겹침 */
const resetTY = { id:'resetTY', beforeDraw(ch){ ch._ty = []; } };

function halo(x, txt, px, py){
  x.lineWidth = 3.4; x.lineJoin = 'round';
  x.strokeStyle = 'rgba(255,255,255,.95)';
  x.strokeText(txt, px, py);
  x.fillText(txt, px, py);
}
function haloDark(x, txt, px, py){
  x.lineWidth = 3.2; x.lineJoin = 'round';
  x.strokeStyle = 'rgba(15,26,36,.62)';
  x.strokeText(txt, px, py);
  x.fillStyle = '#fff';
  x.fillText(txt, px, py);
}
function chip(x, label, px, py, col){
  x.font = '700 ' + (NARROW ? 8 : 9) + 'px ' + FONT;
  const w = x.measureText(label).width + 9;
  x.fillStyle = 'rgba(255,255,255,.97)';
  x.fillRect(px, py, w, 13);
  x.strokeStyle = col; x.lineWidth = 1;
  x.strokeRect(px + .5, py + .5, w - 1, 12);
  x.fillStyle = col; x.textAlign = 'left'; x.textBaseline = 'middle';
  x.fillText(label, px + 4.5, py + 7);
}

const barLabel = {
  id:'barLabel',
  afterDatasetsDraw(ch, a, o){
    o = o || {};
    const x = ch.ctx, ta = ch._ty || [], ca = ch.chartArea;
    if(!ca) return;
    const used = [];
    x.save(); x.font = '800 ' + (o.size || (NARROW ? 9 : 10.5)) + 'px ' + FONT;
    ch.data.datasets.forEach((ds, di)=>{
      if(ds._nolab) return;
      const m = ch.getDatasetMeta(di);
      if(m.hidden) return;
      m.data.forEach((el, i)=>{
        const v = ds._tot ? ds._tot[i] : ds.data[i]; if(v===null||v===undefined) return;   /* _tot: 적층 합계 라벨 */
        const txt = (o.fmt ? o.fmt(v, di) : cm(Math.round(v)));
        x.fillStyle = ds._lab || C.ink;

        /* 가로 막대 — 오른쪽에 쓰되 잘릴 것 같으면 막대 안쪽 흰 글씨 */
        if(ch.options.indexAxis === 'y'){
          const tw = x.measureText(txt).width;
          if(el.x + 7 + tw > ch.width - 2){
            x.textAlign = 'right'; x.textBaseline = 'middle';
            haloDark(x, txt, el.x - 6, el.y);
          }else{
            x.textAlign = 'left'; x.textBaseline = 'middle';
            halo(x, txt, el.x + 7, el.y);
          }
          return;
        }
        /* 누적 막대 — 구간 안쪽 흰 글씨 */
        if(ds._pos === 'inbar'){
          const top = Math.max(el.y, ca.top);
          const bot = Math.min(el.base !== undefined ? el.base : el.y + (el.height||0),
                               ca.bottom);
          if(bot - top > 17){
            x.textAlign='center'; x.textBaseline='middle';
            haloDark(x, txt, el.x, (top + bot) / 2);
          }
          return;
        }
        /* 세로 막대ㆍ선 — 기준선ㆍ다른 라벨과 겹치면 자동 회피 */
        const dir = (ds._pos === 'below') ? 1 : -1;
        const tw2 = x.measureText(txt).width;
        const lx = Math.max(ca.left + tw2/2 + 2,
                   Math.min(el.x, ca.right - tw2/2 - 2));
        const x1 = lx - tw2/2, x2 = lx + tw2/2;
        let y = el.y + dir * 12 + (ds._dy || 0);
        /* 기준선ㆍ이미 그린 라벨과 사각형이 겹치면 밀어냄 */
        const clash = function(yy){
          if(ta.some(function(t){ return Math.abs(t - yy) < 14; })) return true;
          return used.some(function(d){
            return !(x2 < d.x1 - 2 || x1 > d.x2 + 2) && Math.abs(d.y - yy) < 13;
          });
        };
        let guard = 0;
        while(clash(y) && guard < 10){ y += dir * 13; guard++; }
        y = Math.max(8, Math.min(y, ch.height - 8));
        used.push({x1:x1, x2:x2, y:y});
        x.textAlign='center'; x.textBaseline='middle';
        halo(x, txt, lx, y);
      });
    });
    x.restore();
  }
};

function hline(val, label, ax, col, inside){
  const A = ax || 'y';
  return {
    id:'hl_'+label+A,
    beforeDatasetsDraw(ch){
      const sc = ch.scales[A], a = ch.chartArea; if(!sc || !a) return;
      const py = sc.getPixelForValue(val);
      if(isFinite(py) && py >= a.top && py <= a.bottom)
        (ch._ty = ch._ty || []).push(py);
    },
    afterDraw(ch){
      const a = ch.chartArea, sc = ch.scales[A]; if(!a || !sc) return;
      const py = sc.getPixelForValue(val); if(!isFinite(py)) return;
      const x = ch.ctx, c = col || C.base;
      const out = (py < a.top) ? 'up' : (py > a.bottom ? 'down' : null);
      x.save();
      if(!out){
        x.setLineDash([4,3]); x.lineWidth = 1.4; x.strokeStyle = c;
        x.beginPath(); x.moveTo(a.left, py); x.lineTo(a.right, py); x.stroke();
        x.setLineDash([]);
      }
      const txt = out ? (label + (out==='up' ? ' ↑' : ' ↓')) : label;
      x.font = '700 9px ' + FONT;
      const w = x.measureText(txt).width + 9;
      let px;
      if(NARROW || inside){             /* 좁은 화면·inside 지정 시 플롯 안쪽 우측 */
        px = a.right - w - 3;
        if(px < a.left + 2) px = a.left + 2;
      }else{
        px = a.right + 5;
        if(px + w > ch.width - 2) px = ch.width - w - 2;
      }
      const ty = out === 'up' ? a.top + 2
               : out === 'down' ? a.bottom - 15
               : Math.max(2, Math.min(py - 6.5, ch.height - 15));
      chip(x, txt, px, ty, c);
      x.restore();
    }
  };
}
/* 세로 기준선(가로 막대용) — 칩은 상단 여백에 */
function vline(val, label){
  return { id:'vl_'+label, afterDraw(ch){
    const a = ch.chartArea, sc = ch.scales.x; if(!a || !sc) return;
    const px = sc.getPixelForValue(val); if(!isFinite(px)) return;
    const x = ch.ctx;
    x.save(); x.setLineDash([4,3]); x.lineWidth=1.4; x.strokeStyle=C.base;
    x.beginPath(); x.moveTo(px, a.top); x.lineTo(px, a.bottom); x.stroke();
    x.setLineDash([]);
    x.font = '700 9px ' + FONT;
    const w = x.measureText(label).width + 9;
    let cx = px - w/2;
    cx = Math.max(2, Math.min(cx, ch.width - w - 2));
    chip(x, label, cx, Math.max(2, a.top - 18), C.base);
    x.restore();
  }};
}

const LEG = {display:false};
function legendFor(id, items){
  const cv = document.getElementById(id); if(!cv) return;
  const box = cv.parentNode, card = box.parentNode;
  if(card.querySelector('.lg.auto')) return;
  const d = document.createElement('div');
  d.className = 'lg auto';
  d.innerHTML = items.map(s =>
    '<span><i style="background:'+s.c+(s.dash?';opacity:.85':'')+'"></i>'+s.label+'</span>'
  ).join('');
  card.appendChild(d);
}

/* 비율선을 막대 위 구간(상단 약 30%)에 배치하는 우축 범위 */
function rateBand(vals, tgt){
  const v = vals.filter(function(x){ return x !== null && isFinite(x); }).concat([tgt]);
  const mn = Math.min.apply(null, v), mx = Math.max.apply(null, v);
  const sp = Math.max(mx - mn, 3);
  return {min: Math.max(0, Math.floor((mn - sp * 2.4) / 10) * 10),
          max: Math.ceil((mx + sp * 0.35) / 5) * 5};
}

/* ── 공통 빌더 ────────────────────────────────────── */
function span(arrs, extra){
  const v = [].concat.apply([], arrs).filter(x=>x!==null && isFinite(x))
              .concat(extra || []);
  const mn = Math.min.apply(null, v), mx = Math.max.apply(null, v);
  const pad = Math.max((mx - mn) * 0.60, Math.abs(mx) * 0.02, 0.6);
  return {min: mn - pad, max: mx + pad};
}
/* 선 차트 — 목표선 있으면 우측 여백 확보 */
function lineChart(id, series, o){
  o = o || {};
  const rg = o.range || span(series.map(s=>s.data), (o.tgt!==undefined ? [o.tgt] : []));
  const hasT = (o.tgt !== undefined);
  mk(id, {
    type:'line',
    data:{labels:o.labels || WL, datasets:series.map((s,i)=>({
      label:s.label, data:s.data, borderColor:s.c, backgroundColor:s.fill ? s.c+'18' : s.c,
      borderWidth:2.4, pointRadius:3.6, pointBackgroundColor:s.c, tension:.25,
      borderDash: s.dash ? [5,3] : undefined, fill: !!s.fill,
      _lab:s.c, _pos: s.pos || (i === 0 ? 'above' : 'below')
    }))},
    options:{maintainAspectRatio:false,
      layout:{padding:{top:26, bottom:14, left:6, right: hasT ? RPAD : 16}},
      plugins:{legend: series.length > 1 ? LEG : {display:false},
        barLabel:{fmt: o.fmt || (v=>v.toFixed(1)+'%')}},
      scales:{
        y:{grid:{color:C.line}, suggestedMin:rg.min, suggestedMax:rg.max,
           ticks:{maxTicksLimit:6, callback: o.tick || (v=>v.toFixed(0)+'%')}},
        x:{grid:{display:false}}}},
    plugins:[resetTY].concat(hasT ? [hline(o.tgt, o.tgtLabel)] : []).concat([barLabel])
  });
  if(series.length > 1) legendFor(id, series);
}
/* 세로 막대 차트 */
function barChart(id, series, o){
  o = o || {};
  const hasT = (o.tgt !== undefined) || (o.tgts !== undefined);
  const mx = Math.max.apply(null, [].concat.apply([], series.map(s=>s.data))
    .filter(v=>v!==null && isFinite(v)));
  mk(id, {
    type:'bar',
    data:{labels: o.labels || WL, datasets:series.map(s=>({
      label:s.label, data:s.data,
      backgroundColor: s.flat ? s.c : s.data.map((_,i)=>alpha(i, s.c)),
      borderRadius:3, barPercentage: o.bp || .78, _lab:s.c, _pos:s.pos,
      stack: s.stack, yAxisID: s.ax
    }))},
    options:{maintainAspectRatio:false,
      layout:{padding:{top:20, bottom:6, left:4, right: hasT ? RPAD : 12}},
      plugins:{legend: series.length > 1 ? LEG : {display:false},
        barLabel:{fmt: o.fmt || (v=>cm(Math.round(v)))}},
      scales:{
        x:{grid:{display:false}, stacked:!!o.stacked, ticks:{font:{size:9.5}}},
        y:{grid:{color:C.line}, stacked:!!o.stacked,
           beginAtZero: o.min === undefined, min:o.min,
           suggestedMax: o.max || mx * 1.22, ticks:{callback: o.tick || (v=>cm(v))}}}},
    plugins:[resetTY].concat(o.tgts ? o.tgts.map(t=>hline(t.v, t.label, 'y', t.c)) : (hasT ? [hline(o.tgt, o.tgtLabel)] : [])).concat([barLabel])
  });
  if(series.length > 1) legendFor(id, series);
}
/* 가로 막대 차트 — 목표 100% 세로선 */
function hbarChart(id, labels, series, o){
  o = o || {};
  mk(id, {
    type:'bar',
    data:{labels:labels, datasets:series.map(s=>({
      label:s.label, data:s.data, backgroundColor:s.bg || s.c, borderRadius:3,
      barPercentage:.76, _lab:s.c || C.ink}))},
    options:{indexAxis:'y', maintainAspectRatio:false,
      layout:{padding:{top:26, bottom:4, right:NARROW?44:52, left:2}},
      plugins:{legend: series.length > 1 ? LEG : {display:false},
        barLabel:{fmt: o.fmt || (v=>v.toFixed(1)+'%')}},
      scales:{x:{beginAtZero:true, max:o.max || 140, grid:{color:C.line},
          ticks:{stepSize:(o.max||140)===100 ? (NARROW?50:25) : (NARROW?50:40), maxRotation:0, font:{size:NARROW?9:10},
                 callback:v=>v+'%'}},
        y:{grid:{display:false},
           ticks:{font:{size:NARROW?9:10.5, weight:'700'}, autoSkip:false, padding:2,
                  crossAlign:'far'},
           afterFit:function(sc){ sc.width = Math.min(sc.width, narrowNow()?118:215); }}}},
    plugins:[resetTY, barLabel, vline(100, o.tgtLabel || '목표 100%')]

}
/* 도넛 */
const donutLabel = {
  id:'donutLabel',
  afterDatasetsDraw(ch, a, o){
    o = o || {};
    const x = ch.ctx, m = ch.getDatasetMeta(0), ds = ch.data.datasets[0];
    const tot = ds.data.reduce((s,v)=>s+(v||0), 0);
    const ca = ch.chartArea; if(!ca) return;
    x.save(); x.textAlign='center'; x.textBaseline='middle';
    x.font = '700 9.5px ' + FONT;
    m.data.forEach((el, i)=>{
      const v = ds.data[i]; if(!v) return;
      const p = v/tot*100; if(p < 6) return;
      const c = el.getCenterPoint();
      x.fillStyle = '#fff';
      x.fillText(p.toFixed(1)+'%', c.x, c.y);
    });
    if(o.center){
      const cx = (ca.left+ca.right)/2, cy = (ca.top+ca.bottom)/2;
      x.fillStyle = C.ink; x.font = '800 15px ' + FONT;
      x.fillText(o.center, cx, cy - 7);
      x.fillStyle = C.muted; x.font = '600 9.5px ' + FONT;
      x.fillText(o.sub || '', cx, cy + 9);
    }
    x.restore();
  }
};
function donutChart(id, labels, vals, colors, sub, unit){
  const tot = vals.reduce((a,b)=>a+b, 0);
  mk(id, {
    type:'doughnut',
    data:{labels:labels, datasets:[{data:vals, backgroundColor:colors,
      borderWidth:2, borderColor:'#fff'}]},
    options:{maintainAspectRatio:false, cutout:'58%',
      layout:{padding:{top:6, bottom:2}},
      plugins:{legend:{display:false},
        tooltip:{callbacks:{label:c=>c.label+' '+cm(c.parsed)+unit}},
        donutLabel:{center:cm(Math.round(tot)), sub:sub}}},
    plugins:[donutLabel]
  });
  legendFor(id, labels.map((l,i)=>({label:l, c:colors[i]})));
}
